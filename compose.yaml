services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: dayfinch
      POSTGRES_USER: dayfinch
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dayfinch -d dayfinch"]
      interval: 5s
      timeout: 5s
      retries: 12
    volumes:
      - dayfinch-postgres:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5433:5432"
    restart: unless-stopped

  dayfinch-server:
    build:
      context: .
      target: server
    environment:
      TRACKER_ADMIN_PASSWORD: ${TRACKER_ADMIN_PASSWORD:?Set TRACKER_ADMIN_PASSWORD in .env}
      TRACKER_ADMIN_EMAIL: ${TRACKER_ADMIN_EMAIL:-admin@example.local}
      TRACKER_ENVIRONMENT: ${TRACKER_ENVIRONMENT:-development}
      TRACKER_PUBLIC_URL: ${TRACKER_PUBLIC_URL:-http://127.0.0.1:8000}
      TRACKER_ALLOWED_HOSTS: ${TRACKER_ALLOWED_HOSTS:-127.0.0.1,localhost}
      TRACKER_SESSION_SECRET: ${TRACKER_SESSION_SECRET:?Set TRACKER_SESSION_SECRET in .env}
      TRACKER_DOCUMENT_ENCRYPTION_KEY: ${TRACKER_DOCUMENT_ENCRYPTION_KEY:-}
      TRACKER_INTEGRATION_ENCRYPTION_KEYS: ${TRACKER_INTEGRATION_ENCRYPTION_KEYS:-}
      TRACKER_DATABASE_URL: postgresql://dayfinch:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}@postgres:5432/dayfinch
      TRACKER_DATABASE_MIN_POOL_SIZE: ${TRACKER_DATABASE_MIN_POOL_SIZE:-1}
      TRACKER_DATABASE_MAX_POOL_SIZE: ${TRACKER_DATABASE_MAX_POOL_SIZE:-10}
      TRACKER_COOKIE_SECURE: ${TRACKER_COOKIE_SECURE:-false}
      TRACKER_RETENTION_DAYS: ${TRACKER_RETENTION_DAYS:-30}
      TRACKER_AUDIT_RETENTION_DAYS: ${TRACKER_AUDIT_RETENTION_DAYS:-2555}
      TRACKER_INVITATION_HOURS: ${TRACKER_INVITATION_HOURS:-168}
      TRACKER_LOGIN_WINDOW_MINUTES: ${TRACKER_LOGIN_WINDOW_MINUTES:-15}
      TRACKER_LOGIN_IDENTITY_FAILURE_LIMIT: ${TRACKER_LOGIN_IDENTITY_FAILURE_LIMIT:-8}
      TRACKER_LOGIN_SOURCE_FAILURE_LIMIT: ${TRACKER_LOGIN_SOURCE_FAILURE_LIMIT:-50}
      TRACKER_RATE_LIMIT_WINDOW_SECONDS: ${TRACKER_RATE_LIMIT_WINDOW_SECONDS:-60}
      TRACKER_ANONYMOUS_REQUEST_LIMIT: ${TRACKER_ANONYMOUS_REQUEST_LIMIT:-120}
      TRACKER_WEB_REQUEST_LIMIT: ${TRACKER_WEB_REQUEST_LIMIT:-600}
      TRACKER_DEVICE_REQUEST_LIMIT: ${TRACKER_DEVICE_REQUEST_LIMIT:-600}
      TRACKER_DEVICE_REPLAY_REQUEST_LIMIT: ${TRACKER_DEVICE_REPLAY_REQUEST_LIMIT:-6000}
      TRACKER_LOG_LEVEL: ${TRACKER_LOG_LEVEL:-INFO}
      TRACKER_METRICS_BEARER_TOKEN: ${TRACKER_METRICS_BEARER_TOKEN:-}
      TRACKER_STORAGE_BACKEND: ${TRACKER_STORAGE_BACKEND:-local}
      TRACKER_S3_BUCKET: ${TRACKER_S3_BUCKET:-}
      TRACKER_S3_REGION: ${TRACKER_S3_REGION:-us-east-1}
      TRACKER_S3_ENDPOINT_URL: ${TRACKER_S3_ENDPOINT_URL:-}
      TRACKER_S3_SSE: ${TRACKER_S3_SSE:-AES256}
      TRACKER_S3_KMS_KEY_ID: ${TRACKER_S3_KMS_KEY_ID:-}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-}
      AWS_SESSION_TOKEN: ${AWS_SESSION_TOKEN:-}
      TRACKER_SMTP_HOST: ${TRACKER_SMTP_HOST:-}
      TRACKER_SMTP_PORT: ${TRACKER_SMTP_PORT:-587}
      TRACKER_SMTP_USERNAME: ${TRACKER_SMTP_USERNAME:-}
      TRACKER_SMTP_PASSWORD: ${TRACKER_SMTP_PASSWORD:-}
      TRACKER_SMTP_FROM_EMAIL: ${TRACKER_SMTP_FROM_EMAIL:-}
      TRACKER_SMTP_STARTTLS: ${TRACKER_SMTP_STARTTLS:-true}
      TRACKER_SMTP_TIMEOUT_SECONDS: ${TRACKER_SMTP_TIMEOUT_SECONDS:-10}
      TRACKER_OIDC_ISSUER: ${TRACKER_OIDC_ISSUER:-}
      TRACKER_OIDC_DISCOVERY_URL: ${TRACKER_OIDC_DISCOVERY_URL:-}
      TRACKER_OIDC_CLIENT_ID: ${TRACKER_OIDC_CLIENT_ID:-}
      TRACKER_OIDC_CLIENT_SECRET: ${TRACKER_OIDC_CLIENT_SECRET:-}
      TRACKER_OIDC_CLIENT_AUTH_METHOD: ${TRACKER_OIDC_CLIENT_AUTH_METHOD:-client_secret_basic}
      TRACKER_OIDC_END_SESSION_URL: ${TRACKER_OIDC_END_SESSION_URL:-}
      TRACKER_SAML_IDP_ENTITY_ID: ${TRACKER_SAML_IDP_ENTITY_ID:-}
      TRACKER_SAML_IDP_METADATA_B64: ${TRACKER_SAML_IDP_METADATA_B64:-}
      TRACKER_SAML_SP_PRIVATE_KEY_B64: ${TRACKER_SAML_SP_PRIVATE_KEY_B64:-}
      TRACKER_SAML_SP_CERTIFICATE_B64: ${TRACKER_SAML_SP_CERTIFICATE_B64:-}
      TRACKER_SAML_EMAIL_ATTRIBUTE: ${TRACKER_SAML_EMAIL_ATTRIBUTE:-email}
      TRACKER_SCIM_BEARER_TOKEN: ${TRACKER_SCIM_BEARER_TOKEN:-}
      TRACKER_GITHUB_APP_SLUG: ${TRACKER_GITHUB_APP_SLUG:-}
      TRACKER_GITHUB_CLIENT_ID: ${TRACKER_GITHUB_CLIENT_ID:-}
      TRACKER_GITHUB_CLIENT_SECRET: ${TRACKER_GITHUB_CLIENT_SECRET:-}
      TRACKER_GITHUB_PRIVATE_KEY_B64: ${TRACKER_GITHUB_PRIVATE_KEY_B64:-}
      TRACKER_GITHUB_WEBHOOK_SECRET: ${TRACKER_GITHUB_WEBHOOK_SECRET:-}
      TRACKER_GITHUB_API_URL: ${TRACKER_GITHUB_API_URL:-https://api.github.com}
      TRACKER_GITHUB_WEB_URL: ${TRACKER_GITHUB_WEB_URL:-https://github.com}
      TRACKER_GITHUB_API_VERSION: ${TRACKER_GITHUB_API_VERSION:-2026-03-10}
      TRACKER_JIRA_CLIENT_ID: ${TRACKER_JIRA_CLIENT_ID:-}
      TRACKER_JIRA_CLIENT_SECRET: ${TRACKER_JIRA_CLIENT_SECRET:-}
      TRACKER_JIRA_AUTHORIZE_URL: ${TRACKER_JIRA_AUTHORIZE_URL:-https://auth.atlassian.com/authorize}
      TRACKER_JIRA_TOKEN_URL: ${TRACKER_JIRA_TOKEN_URL:-https://auth.atlassian.com/oauth/token}
      TRACKER_JIRA_API_URL: ${TRACKER_JIRA_API_URL:-https://api.atlassian.com}
      TRACKER_ASANA_CLIENT_ID: ${TRACKER_ASANA_CLIENT_ID:-}
      TRACKER_ASANA_CLIENT_SECRET: ${TRACKER_ASANA_CLIENT_SECRET:-}
      TRACKER_ASANA_AUTHORIZE_URL: ${TRACKER_ASANA_AUTHORIZE_URL:-https://app.asana.com/-/oauth_authorize}
      TRACKER_ASANA_TOKEN_URL: ${TRACKER_ASANA_TOKEN_URL:-https://app.asana.com/-/oauth_token}
      TRACKER_ASANA_TOKEN_INFO_URL: ${TRACKER_ASANA_TOKEN_INFO_URL:-https://app.asana.com/-/token_info}
      TRACKER_ASANA_REVOKE_URL: ${TRACKER_ASANA_REVOKE_URL:-https://app.asana.com/-/oauth_revoke}
      TRACKER_ASANA_API_URL: ${TRACKER_ASANA_API_URL:-https://app.asana.com/api/1.0}
      TRACKER_SLACK_CLIENT_ID: ${TRACKER_SLACK_CLIENT_ID:-}
      TRACKER_SLACK_CLIENT_SECRET: ${TRACKER_SLACK_CLIENT_SECRET:-}
      TRACKER_SLACK_AUTHORIZE_URL: ${TRACKER_SLACK_AUTHORIZE_URL:-https://slack.com/oauth/v2/authorize}
      TRACKER_SLACK_TOKEN_URL: ${TRACKER_SLACK_TOKEN_URL:-https://slack.com/api/oauth.v2.access}
      TRACKER_SLACK_API_URL: ${TRACKER_SLACK_API_URL:-https://slack.com/api}
      TRACKER_AGENT_WINDOWS_URL: ${TRACKER_AGENT_WINDOWS_URL:-}
      TRACKER_AGENT_MACOS_URL: ${TRACKER_AGENT_MACOS_URL:-}
      TRACKER_AGENT_LINUX_URL: ${TRACKER_AGENT_LINUX_URL:-}
      TRACKER_AGENT_UPDATE_MANIFEST_URL: ${TRACKER_AGENT_UPDATE_MANIFEST_URL:-}
      TRACKER_AGENT_UPDATE_PUBLIC_KEY: ${TRACKER_AGENT_UPDATE_PUBLIC_KEY:-}
      TRACKER_PAYMENT_PROVIDER: ${TRACKER_PAYMENT_PROVIDER:-manual}
      TRACKER_PAYMENT_WEBHOOK_URL: ${TRACKER_PAYMENT_WEBHOOK_URL:-}
      TRACKER_PAYMENT_WEBHOOK_SECRET: ${TRACKER_PAYMENT_WEBHOOK_SECRET:-}
      TRACKER_PAYPAL_CLIENT_ID: ${TRACKER_PAYPAL_CLIENT_ID:-}
      TRACKER_PAYPAL_CLIENT_SECRET: ${TRACKER_PAYPAL_CLIENT_SECRET:-}
      TRACKER_PAYPAL_API_URL: ${TRACKER_PAYPAL_API_URL:-https://api-m.sandbox.paypal.com}
      TRACKER_WISE_API_TOKEN: ${TRACKER_WISE_API_TOKEN:-}
      TRACKER_WISE_PROFILE_ID: ${TRACKER_WISE_PROFILE_ID:-0}
      TRACKER_WISE_BALANCE_ID: ${TRACKER_WISE_BALANCE_ID:-0}
      TRACKER_WISE_SOURCE_CURRENCY: ${TRACKER_WISE_SOURCE_CURRENCY:-USD}
      TRACKER_WISE_API_URL: ${TRACKER_WISE_API_URL:-https://api.wise-sandbox.com/2026Q3}
      TRACKER_WISE_WEBHOOK_PUBLIC_KEY_B64: ${TRACKER_WISE_WEBHOOK_PUBLIC_KEY_B64:-}
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - dayfinch-data:/data
    init: true
    read_only: true
    tmpfs:
      - /tmp:size=64m,noexec,nosuid
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    stop_grace_period: 30s
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/readyz', timeout=3)"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 15s
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy

  dayfinch-ops:
    profiles: ["ops"]
    build:
      context: .
      target: operations
    environment:
      TRACKER_DATABASE_URL: postgresql://dayfinch:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}@postgres:5432/dayfinch
      TRACKER_STORAGE_BACKEND: ${TRACKER_STORAGE_BACKEND:-local}
      TRACKER_S3_BUCKET: ${TRACKER_S3_BUCKET:-}
      TRACKER_S3_REGION: ${TRACKER_S3_REGION:-us-east-1}
      TRACKER_S3_ENDPOINT_URL: ${TRACKER_S3_ENDPOINT_URL:-}
      TRACKER_S3_SSE: ${TRACKER_S3_SSE:-AES256}
      TRACKER_S3_KMS_KEY_ID: ${TRACKER_S3_KMS_KEY_ID:-}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-}
      AWS_SESSION_TOKEN: ${AWS_SESSION_TOKEN:-}
      TRACKER_BACKUP_ENCRYPTION_KEY: ${TRACKER_BACKUP_ENCRYPTION_KEY:-}
    volumes:
      - dayfinch-data:/data
    read_only: true
    tmpfs:
      - /tmp:size=64m,noexec,nosuid
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  dayfinch-data:
  dayfinch-postgres:
