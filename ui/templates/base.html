<!doctype html>
<html lang="en" class="h-full">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}Dayfinch{% endblock %}</title>
    <link rel="stylesheet" href="{{ url_for('static', path='/app.css') }}">
  </head>
  <body class="h-full bg-slate-50 font-sans text-[15px] text-slate-800 antialiased">
    <header class="border-b border-slate-200 bg-white">
      <div class="mx-auto flex h-14 max-w-6xl items-center justify-between gap-4 px-4 sm:px-6">
        <a class="flex items-center gap-2 text-sm font-semibold tracking-tight text-slate-900" href="/">
          <span class="inline-block h-2 w-2 rounded-full bg-brand-600"></span>
          Dayfinch
        </a>
        {% if current_user %}
        <nav class="flex items-center gap-1 text-sm">
          <a class="rounded-md px-2.5 py-1.5 text-slate-600 transition hover:bg-slate-100 hover:text-slate-900" href="/">Devices</a>
          <a class="rounded-md px-2.5 py-1.5 text-slate-600 transition hover:bg-slate-100 hover:text-slate-900" href="/timesheets">Timesheets</a>
          <span class="mx-2 hidden h-4 w-px bg-slate-200 sm:block"></span>
          <span class="hidden max-w-[16rem] truncate text-slate-500 sm:inline" title="Signed in as {{ current_user.role }}">{{ current_user.email }}</span>
          <form method="post" action="/logout">
            <input type="hidden" name="csrf" value="{{ csrf_token }}">
            <button class="rounded-md px-2.5 py-1.5 text-slate-600 transition hover:bg-slate-100 hover:text-slate-900" type="submit">Sign out</button>
          </form>
        </nav>
        {% endif %}
      </div>
    </header>
    <main class="mx-auto max-w-6xl px-4 py-8 sm:px-6 sm:py-10">{% block content %}{% endblock %}</main>
  </body>
</html>
