{% extends "base.html" %}
{% block title %}Sign in · Dayfinch{% endblock %}
{% block content %}
<section class="mx-auto max-w-md">
  <div class="card card-body">
    <p class="eyebrow">Private workspace</p>
    <h1 class="page-title mt-2">Sign in</h1>
    <p class="muted mt-1">Only an administrator or a person with an accepted invitation can sign in.</p>
    {% if error %}<p class="notice-error mt-5">{{ error }}</p>{% endif %}
    <form method="post" action="/login" class="mt-6 grid gap-4">
      <input type="hidden" name="csrf" value="{{ csrf_token }}">
      <label class="field">
        <span class="field-label">Email</span>
        <input class="input" name="email" type="email" autocomplete="username" maxlength="254" required autofocus>
      </label>
      <label class="field">
        <span class="field-label">Password</span>
        <input class="input" name="password" type="password" autocomplete="current-password" required>
      </label>
      <button class="btn btn-primary mt-1 w-full" type="submit">Sign in</button>
    </form>
  </div>
</section>
{% endblock %}
