{% extends "base.html" %}{% block title %}Choose Asana workspace · Dayfinch{% endblock %}{% block content %}
<div><p class="eyebrow">Asana connection</p><h1 class="page-title mt-1">Choose a workspace</h1><p class="muted mt-1">Only the selected Asana workspace will be connected to this Dayfinch organization.</p></div>
<section class="card card-body mt-6 max-w-3xl"><form method="post" action="/integrations/asana/select" class="grid gap-4"><input type="hidden" name="csrf" value="{{ csrf_token }}"><input type="hidden" name="pending_id" value="{{ pending_id }}"><label class="field"><span class="field-label">Accessible workspace</span><select class="input" name="workspace_id" required><option value="">Choose an Asana workspace</option>{% for workspace in workspaces %}<option value="{{ workspace.id }}">{{ workspace.name }}</option>{% endfor %}</select><span class="field-help">The encrypted temporary authorization expires after ten minutes.</span></label><div class="flex flex-wrap gap-2"><button class="btn btn-primary">Connect workspace</button><a class="btn btn-secondary" href="/settings">Cancel</a></div></form></section>
{% endblock %}
