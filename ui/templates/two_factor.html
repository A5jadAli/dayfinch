{% extends "base.html" %}{% block title %}Two-factor authentication · Dayfinch{% endblock %}{% block guest_content %}<div class="grid min-h-screen place-items-center bg-[#111827] p-5"><section class="w-full max-w-md rounded-2xl bg-white p-8 shadow-2xl"><div class="grid h-12 w-12 place-items-center rounded-xl bg-brand-600 text-xl font-black text-white">D</div><p class="eyebrow mt-6">Security check</p><h1 class="page-title mt-1">Enter your code</h1><p class="muted mt-2">Open your authenticator app and enter the current six-digit Dayfinch code.</p>{% if error %}<div class="notice-error mt-4">{{ error }}</div>{% endif %}<form method="post" class="mt-5 grid gap-4"><input type="hidden" name="csrf" value="{{ csrf_token }}"><input class="input py-3 text-center text-xl tracking-[.4em]" name="code" inputmode="numeric" pattern="[0-9]{6}" maxlength="6" autofocus required><button class="btn btn-primary py-3">Verify and continue</button></form></section></div>{% endblock %}
