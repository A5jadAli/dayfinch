{% extends "base.html" %}{% block title %}Two-factor authentication · Dayfinch{% endblock %}{% block guest_content %}<div class="grid min-h-screen place-items-center bg-rail p-5"><section class="reveal w-full max-w-md rounded-2xl border border-line bg-surface p-8" style="box-shadow:var(--shadow-lg)"><div class="grid h-12 w-12 place-items-center rounded-[14px] bg-gradient-to-br from-brand to-indigo-600 text-white" style="box-shadow:0 10px 24px -8px var(--p-brand)"><svg viewBox="0 0 32 32" class="h-5 w-5"><use href="#i-mark"></use></svg></div><p class="eyebrow mt-6">Security check</p><h1 class="page-title mt-1">Enter your code</h1><p class="muted mt-2">Open your authenticator app and enter the current six-digit Dayfinch code.</p>{% if error %}<div class="notice-error mt-4">{{ error }}</div>{% endif %}<form method="post" class="mt-5 grid gap-4"><input type="hidden" name="csrf" value="{{ csrf_token }}"><input class="input py-3 text-center text-xl tracking-[.4em]" name="code" inputmode="numeric" pattern="[0-9]{6}" maxlength="6" autofocus required><button class="btn btn-primary py-3">Verify and continue</button></form></section></div>{% endblock %}
