# Local-only Mailpit and MinIO stand-ins. This file is opt-in and is never used by
# the default Compose stack or a production deployment.
services:
  dayfinch-server:
    environment:
      TRACKER_STORAGE_BACKEND: s3
      TRACKER_S3_BUCKET: dayfinch-local-screenshots
      TRACKER_S3_REGION: us-east-1
      TRACKER_S3_ENDPOINT_URL: http://minio:9000
      TRACKER_S3_SSE: ""
      TRACKER_S3_KMS_KEY_ID: ""
      AWS_ACCESS_KEY_ID: ${DAYFINCH_LOCAL_MINIO_USER:-dayfinch-local}
      AWS_SECRET_ACCESS_KEY: ${DAYFINCH_LOCAL_MINIO_PASSWORD:-dayfinch-local-password}
      AWS_SESSION_TOKEN: ""
      TRACKER_SMTP_HOST: mailpit
      TRACKER_SMTP_PORT: "1025"
      TRACKER_SMTP_USERNAME: ""
      TRACKER_SMTP_PASSWORD: ""
      TRACKER_SMTP_FROM_EMAIL: dayfinch-local@example.test
      TRACKER_SMTP_STARTTLS: "false"
    depends_on:
      mailpit:
        condition: service_started
      minio-init:
        condition: service_completed_successfully

  mailpit:
    image: axllent/mailpit:v1.31.1
    environment:
      MP_DATABASE: /data/mailpit.db
      MP_MAX_MESSAGES: "5000"
    ports:
      - "127.0.0.1:1025:1025"
      - "127.0.0.1:8025:8025"
    volumes:
      - dayfinch-mailpit:/data
    restart: unless-stopped

  minio:
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${DAYFINCH_LOCAL_MINIO_USER:-dayfinch-local}
      MINIO_ROOT_PASSWORD: ${DAYFINCH_LOCAL_MINIO_PASSWORD:-dayfinch-local-password}
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"
    volumes:
      - dayfinch-minio:/data
    restart: unless-stopped

  minio-init:
    image: minio/mc:RELEASE.2025-08-13T08-35-41Z
    depends_on:
      - minio
    environment:
      MINIO_ROOT_USER: ${DAYFINCH_LOCAL_MINIO_USER:-dayfinch-local}
      MINIO_ROOT_PASSWORD: ${DAYFINCH_LOCAL_MINIO_PASSWORD:-dayfinch-local-password}
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        until mc alias set local http://minio:9000 "$${MINIO_ROOT_USER}" "$${MINIO_ROOT_PASSWORD}"; do sleep 1; done
        mc mb --ignore-existing local/dayfinch-local-screenshots
        mc version enable local/dayfinch-local-screenshots
        mc version info local/dayfinch-local-screenshots
    restart: "no"

volumes:
  dayfinch-mailpit:
  dayfinch-minio:
