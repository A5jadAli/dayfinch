name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: dayfinch_test
          POSTGRES_USER: dayfinch
          POSTGRES_PASSWORD: test-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U dayfinch -d dayfinch_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      TRACKER_TEST_DATABASE_URL: postgresql://dayfinch:test-password@127.0.0.1:5432/dayfinch_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: pip install -e ".[dev]"
      - run: python -m compileall -q tracker_server tracker_agent tests
      - run: python -m pytest
