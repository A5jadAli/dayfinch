name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  server-tests:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: dayfinch_test
          POSTGRES_USER: dayfinch
          POSTGRES_PASSWORD: test-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U dayfinch -d dayfinch_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      TRACKER_TEST_DATABASE_URL: postgresql://dayfinch:test-password@127.0.0.1:5432/dayfinch_test
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: pip install -e ".[agent,dev]"
      - run: ruff check api agent tests
      - run: ruff format --check api agent tests
      - run: python -m compileall -q api ui agent tests
      - run: python -m pytest

  agent-tests:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025, macos-15]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: pip install -e ".[agent,dev]"
      - run: python -m compileall -q agent tests
      - run: >-
          python -m pytest
          tests/test_active_app.py
          tests/test_activity.py
          tests/test_capture.py
          tests/test_config.py
          tests/test_diagnostics.py
          tests/test_queue.py
