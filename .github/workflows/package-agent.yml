name: Package desktop agent

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  package:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            artifact: dayfinch-agent-linux-x64
          - os: windows-2025
            artifact: dayfinch-agent-windows-x64
          - os: macos-15
            artifact: dayfinch-agent-macos-arm64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: pip install ".[agent,package]"
      - run: pyinstaller --noconfirm --clean packaging/dayfinch_agent.spec
      - run: dist/Dayfinch-Agent --help
        if: runner.os != 'Windows'
      - run: .\dist\Dayfinch-Agent.exe --help
        if: runner.os == 'Windows'
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: dist/Dayfinch-Agent*
          if-no-files-found: error
          retention-days: 14
