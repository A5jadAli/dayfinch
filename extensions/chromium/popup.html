<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Dayfinch Timer</title>
  <style>
    :root { color-scheme: dark; font: 14px system-ui, sans-serif; }
    body { width: 340px; margin: 0; background: #0b1020; color: #eef2ff; }
    header { padding: 18px 20px 12px; border-bottom: 1px solid #252b3e; }
    h1 { margin: 0; font-size: 18px; } #state { color: #9ca3af; margin-top: 5px; }
    main { display: grid; gap: 12px; padding: 16px 20px 20px; }
    label { display: grid; gap: 5px; color: #c7d2fe; font-size: 12px; font-weight: 600; }
    select, input, button { box-sizing: border-box; width: 100%; border-radius: 9px; padding: 10px; font: inherit; }
    select, input { border: 1px solid #343b52; background: #151b2e; color: #f8fafc; }
    .actions { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
    button { border: 0; background: #7c6df2; color: white; font-weight: 700; cursor: pointer; }
    button.secondary { background: #252b3e; } button.danger { background: #7f1d2d; }
    button:disabled { cursor: not-allowed; opacity: .45; }
    #message { min-height: 18px; color: #fca5a5; font-size: 12px; }
    a { color: #a5b4fc; }
  </style>
</head>
<body>
  <header><h1>Dayfinch Timer</h1><div id="state">Connecting to the visible desktop tracker…</div></header>
  <main>
    <label>Project<select id="project"></select></label>
    <label>Task<select id="task"><option value="">General project time</option></select></label>
    <label>Work note<input id="note" maxlength="500" placeholder="What are you working on?"></label>
    <div class="actions"><button id="start">Start</button><button id="pause" class="secondary">Pause</button></div>
    <button id="stop" class="danger">Stop</button>
    <div id="message" role="status"></div>
    <a href="#" id="settings">Connection settings</a>
  </main>
  <script src="popup.js"></script>
</body>
</html>
