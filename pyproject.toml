[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "dayfinch"
version = "0.4.0"
description = "Consent-based screenshot and aggregate activity tracker"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1",
  "itsdangerous>=2.2,<3",
  "jinja2>=3.1,<4",
  "pydantic>=2.10,<3",
  "python-multipart>=0.0.20,<1",
  "psycopg[binary]>=3.2,<4",
  "psycopg-pool>=3.2,<4",
  "uvicorn[standard]>=0.34,<1",
]

[project.optional-dependencies]
agent = [
  "httpx>=0.28,<1",
  "mss>=10,<11",
  "pillow>=11,<13",
  "psutil>=6,<8",
  "pynput>=1.7,<2",
  "pystray>=0.19,<1",
]
dev = [
  "httpx>=0.28,<1",
  "pytest>=8,<10",
  "pytest-cov>=6,<8",
]
package = ["pyinstaller>=6,<7"]
s3 = ["boto3>=1.42,<2"]

[project.scripts]
dayfinch-server = "api.main:run"
dayfinch-agent = "agent.main:run"

[tool.setuptools.packages.find]
include = ["api*", "agent*", "ui*"]

[tool.setuptools.package-data]
ui = ["templates/*.html", "static/*.css"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
